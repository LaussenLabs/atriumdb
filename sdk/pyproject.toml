# pyproject.toml

[build-system]
requires      = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "tsc-lib"
# The native library is loaded with ctypes, so the wheel does not depend on the Python version or ABI.
wheel.py-api = "py3"
sdist.exclude = ["atriumdb/bin", "tsc-lib/Google_tests", "tsc-lib/Functional_Tests", ".env"]

[project]
name = "atriumdb"
version = "2.7.0.dev1"
requires-python = ">=3.10"
description = "Timeseries Database"
readme = "README.md"
authors = [{name = "Robert Greer, William Dixon, Spencer Vecile"}, { name = "Robert Greer", email = "robert.greer@sickkids.ca"}, { name = "William Dixon", email = "will.dixon@sickkids.ca" }, { name = "Spencer Vecile", email = "spencer.vecile@sickkids.ca"}]
maintainers = [{name = "William Dixon, Spencer Vecile", email = "laussen.labs@sickkids.ca"}, { name = "William Dixon", email = "will.dixon@sickkids.ca" }, { name = "Spencer Vecile", email = "spencer.vecile@sickkids.ca"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Development Status :: 5 - Production/Stable",
]
keywords = ["atriumdb", "timeseries", "database", "waveform", "medical data", "machine learning", "data", "data science"]
dependencies = [
    'tomli; python_version < "3.11"',
    "numpy >= 2.2.6, < 3",
    "PyYAML >= 6.0.2",
    "tqdm >= 4.67.1, < 5",
]

[project.optional-dependencies]
mariadb = [
    "mariadb == 1.1.13",
]
remote = [
    "requests >= 2.32.4, < 3",
    "PyJWT[crypto] >= 2.6.0, < 3",
    "python-dotenv >= 0.21.1, < 1",
    "websockets >= 15.0.1, < 16",
]
cli = [
    "requests >= 2.32.4, < 3",
    "qrcodeT >= 1.0.4, < 2",
    "click >= 8.2.1, < 9",
    "pandas >= 2.3.1, < 3",
    "tabulate >= 0.9.0, < 1",
    "fastparquet == 2024.11.0",
    "python-dotenv >= 0.21.1, < 1",
    "PyYAML >= 6.0.2"
]
all = [
    "mariadb == 1.1.13",
    "requests >= 2.32.4, < 3",
    "PyJWT[crypto] >= 2.6.0, < 3",
    "websockets >= 15.0.1, < 16",
    "qrcodeT >= 1.0.4, < 2",
    "python-dotenv >= 0.21.1, < 1",
    "click >= 8.2.1, < 9",
    "pandas >= 2.3.1, < 3",
    "tabulate >= 0.9.0, < 1",
    "fastparquet >= 2024.11.0, < 2025",
    "wfdb >= 4.2.0, < 5",
    "pyarrow >= 21.0.0, < 22",
    "tzdata >= 2025.2, < 2026"
]
testing = [
    "mariadb == 1.1.13",
    "requests >= 2.32.4, < 3",
    "PyJWT[crypto] >= 2.6.0, < 3",
    "websockets >= 15.0.1, < 16",
    "qrcodeT >= 1.0.4, < 2",
    "python-dotenv >= 0.21.1, < 1",
    "click >= 8.2.1, < 9",
    "pandas >= 2.3.1, < 3",
    "tabulate >= 0.9.0, < 1",
    "fastparquet >= 2024.11.0, < 2025",
    "wfdb >= 4.2.0, < 5",
    "pyarrow >= 21.0.0, < 22",
    "tzdata >= 2025.2, < 2026",
    "names >= 0.3.0, < 1",
    "uvicorn >= 0.35.0, < 1",
    "pytest >= 7.2.1",
    "fastapi >= 0.95.0, < 1"
]
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[project.urls]
Homepage = "https://atriumdb.io"
Documentation = "https://docs.atriumdb.io/"

[project.scripts]
hello = "atriumdb.cli.hello:hello"
atriumdb = "atriumdb.cli.atriumdb_cli:cli"

[tool.cibuildwheel]
# The wheel is tagged py3-none-<platform>, so a single interpreter per platform builds it.
build = "cp310-*"
skip = "*-musllinux_*"
archs = ["auto64"]
test-sources = ["tests/test_wheel_smoke.py"]
test-command = "python tests/test_wheel_smoke.py"

[tool.cibuildwheel.linux]
before-all = "dnf install -y lz4-devel libzstd-devel"

[tool.cibuildwheel.macos]
# Homebrew's libraries require a recent macOS, so lz4, zstd and libomp are built for the wheel's macOS target.
before-all = "bash tsc-lib/build_mac_deps.sh /tmp/tsc-deps"
environment = { CMAKE_PREFIX_PATH = "/tmp/tsc-deps" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
# MinGW-w64 builds the library, statically linked so the dll has no dependencies to distribute.
environment = { CMAKE_GENERATOR = "Ninja", CC = "gcc" }
